apiVersion: v1
kind: Service
metadata:
  name: sqlserver-nlb
  namespace: oficina
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
    service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-0f866ddddc81bc1f7,subnet-06c953d248ea4afde"
spec:
  selector:
    app: sqlserver
  ports:
    - port: 1433
      targetPort: 1433
      protocol: TCP
  type: LoadBalancer
