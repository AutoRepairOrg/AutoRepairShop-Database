apiVersion: v1
kind: Service
metadata:
  name: sqlserver-nlb
  namespace: oficina
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
    service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-0f4ea75a68f34c307,subnet-0818a4d05d5ac968c"
spec:
  selector:
    app: sqlserver
  ports:
    - port: 1433
      targetPort: 1433
      protocol: TCP
  type: LoadBalancer
